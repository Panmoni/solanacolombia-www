name = "solanacolombia-www"
# src/worker.ts wraps Astro's handler and adds the reputation bot's Cron Trigger.
main = "./src/worker.ts"
compatibility_date = "2026-11-18"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "solana_builders"
database_id = "dcb2f24a-d72d-4632-8e57-46e53ffcd865"
# The old ad-hoc SQL in migrations/ is applied by hand; wrangler manages only migrations/d1.
migrations_dir = "migrations/d1"

# Reputation bot jobs, dispatched by src/lib/telegram/cron.ts (keep in sync):
#   0 14 * * 1   weekly posts, Mondays 14:00 UTC (09:00 in Bogotá)
#   0 14 25 * *  builder-wants poll, the 25th. The monthly builder-wants summary
#                (PAN-421) takes 0 14 1 * *, so it reads 4-7 days of answers.
[triggers]
crons = ["0 14 * * 1", "0 14 25 * *"]

# For preview deployments (pull requests, preview branches)
[env.preview]
[[env.preview.d1_databases]]
binding = "DB"
database_name = "solana_builders"
database_id = "dcb2f24a-d72d-4632-8e57-46e53ffcd865"  # Use same ID as production

# For production
[env.production]
[[env.production.d1_databases]]
binding = "DB"
database_name = "solana_builders"
database_id = "dcb2f24a-d72d-4632-8e57-46e53ffcd865"

